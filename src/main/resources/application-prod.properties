# ── Datasource (Neon PostgreSQL) ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Santiago

# ── Server (Render inyecta PORT) ──────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT (sin valor por defecto para el secreto) ───────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Brevo email ───────────────────────────────────────────────────────────────
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-email=${BREVO_SENDER_EMAIL}
app.brevo.sender-name=${BREVO_SENDER_NAME:Task Manager}

# ── Recordatorios ─────────────────────────────────────────────────────────────
app.reminders.lead-minutes=${REMINDER_LEAD_MINUTES:30}

# ── Frontend ──────────────────────────────────────────────────────────────────
app.frontend-url=${APP_FRONTEND_URL}

# ── Seguridad cron ────────────────────────────────────────────────────────────
app.cron-secret=${CRON_SECRET}
