spring.application.name=task-manager

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Jackson: serialize LocalDateTime as ISO-8601 string, not timestamp array
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS
app.cors.allowed-origins=http://localhost:4200

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=8080

# JWT
jwt.secret=${JWT_SECRET:dGFza21hbmFnZXItand0LXNlY3JldC1rZXktMjAyNi1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Brevo email (vacío en local → solo log)
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.brevo.sender-name=${BREVO_SENDER_NAME:Task Manager}

# Recordatorios
app.reminders.lead-minutes=${REMINDER_LEAD_MINUTES:30}

# Frontend
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Seguridad cron (vacío en local → siempre 401)
app.cron-secret=${CRON_SECRET:}